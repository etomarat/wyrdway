[mypy]
python_version = 3.11

# Use our local TIC-80 typing stubs for the `tic80` module.
mypy_path = tic80/python/stubs

# NOTE: `exclude` is a regex matched against file paths. We keep it readable and
# support both Windows `\` and POSIX `/` separators via `[\\/]`.
exclude = (?x)
    ^tic80[\\/]python[\\/]stubs[\\/]
  | ^tic80[\\/]python[\\/]build(\.min)?\.py$

# Stricter typing defaults for gameplay/runtime code.
check_untyped_defs = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_subclassing_any = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
